name: AutoSave Farm

on:
  schedule:
    # Checa a cada minuto (repo público = minutos gratuitos ilimitados).
    # O horário real é decidido pela config/autosave no Firestore (editável no site).
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autosave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: autosave/package-lock.json

      - name: Instalar dependências
        working-directory: autosave
        run: npm ci

      - name: Rodar auto-save
        working-directory: autosave
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js
