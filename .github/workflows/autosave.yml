name: AutoSave Farm

on:
  schedule:
    # Intervalo mínimo do GitHub Actions = 5 min (repo público = minutos gratuitos).
    # O horário real é decidido pela config/autosave no Firestore (editável no site);
    # o script usa o horário configurado como carimbo, mesmo que rode minutos depois.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autosave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: autosave/package-lock.json

      - name: Instalar dependências
        working-directory: autosave
        run: npm ci

      - name: Rodar auto-save
        working-directory: autosave
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js
